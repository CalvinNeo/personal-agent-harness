name: Source and privacy checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/privacy_check.py --history
      - run: python -m unittest discover -s plugins/reminder -p 'test_*.py' -v
      - run: python -m unittest discover -s plugins/image_context -p 'test_*.py' -v
      - run: python -m unittest discover -s tests -p 'test_portable_*.py' -v
